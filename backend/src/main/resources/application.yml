spring:
  application:
    name: interview-backend

  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/interview_dev}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:}
    hikari:
      # NFR-30: pool nhỏ cho 0.1 vCPU / 512 MB
      maximum-pool-size: 5
      minimum-idle: 1
      connection-timeout: 30000
      idle-timeout: 600000
      # Retry khi Neon compute vừa thức dậy (SRS §10.5)
      initialization-fail-timeout: -1

  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        default_schema: app
        format_sql: false
    show-sql: false
    open-in-view: false

  flyway:
    enabled: true
    locations: classpath:db/migration
    default-schema: app
    schemas: app
    baseline-on-migrate: false
    # Placeholders for V010 admin seed — values from env vars (design.md §6)
    placeholders:
      admin_email: ${ADMIN_EMAIL:admin@example.com}
      admin_password: ${ADMIN_PASSWORD:ChangeMe123!}

# JWT — NFR-17, FR-01-JWT
# Values come from env vars; never hard-coded here
app:
  jwt:
    secret: ${JWT_SECRET:CHANGE_ME_IN_PRODUCTION_AT_LEAST_32_CHARS_LONG}
    access-ttl-minutes: ${JWT_ACCESS_TTL_MINUTES:60}
    refresh-ttl-days: ${JWT_REFRESH_TTL_DAYS:7}

  # Internal key for Java→Python calls — design.md §6
  internal-api-key: ${INTERNAL_API_KEY:dev-internal-key}

  # Python AI Service base URL — design.md §8
  ai-service:
    base-url: ${AI_SERVICE_BASE_URL:http://localhost:8000}
    timeout-seconds: ${AI_SERVICE_TIMEOUT_SECONDS:40}

  # CORS — design.md §6
  cors:
    allowed-origins: ${ALLOWED_ORIGINS:http://localhost:5173}

  # Admin seed — used by Flyway V010
  admin:
    email: ${ADMIN_EMAIL:admin@example.com}
    # Raw password; Flyway will bcrypt-hash it via pgcrypto
    password: ${ADMIN_PASSWORD:ChangeMe123!}

server:
  port: ${PORT:8080}
  # Graceful shutdown
  shutdown: graceful

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never

logging:
  level:
    com.example.interview: INFO
    org.springframework.security: WARN
    org.flywaydb: INFO
