# Test profile — NFR-33: H2 in-memory, no real Neon, no real AI calls
spring:
  datasource:
    url: jdbc:h2:mem:testdb;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    username: sa
    password:
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: create-drop
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
        default_schema:
    show-sql: false
  flyway:
    # H2 test: use simplified SQL without pg-specific types
    enabled: false

app:
  jwt:
    secret: test-secret-key-must-be-at-least-32-chars-long-for-hs256
    access-ttl-minutes: 60
    refresh-ttl-days: 7
  internal-api-key: test-internal-key
  ai-service:
    base-url: http://localhost:9999   # WireMock / no real service in unit tests
    timeout-seconds: 5
  cors:
    allowed-origins: http://localhost:5173

logging:
  level:
    com.example.interview: DEBUG
